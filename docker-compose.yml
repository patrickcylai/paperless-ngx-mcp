# Reads credentials from .env (copy .env.example and fill it in).
#
#   docker compose up -d --build      start the HTTP server
#   docker compose logs -f            watch it
#   docker compose down               stop it
#
# For a stdio server instead, see the `stdio` profile at the bottom.

services:
    paperless-mcp:
        build:
            context: .
        image: paperless-ngx-mcp:0.1.0
        container_name: paperless-mcp
        restart: unless-stopped

        # PAPERLESS_URL and PAPERLESS_TOKEN come from here.
        env_file:
            - .env

        environment:
            MCP_TRANSPORT: http
            # Must be 0.0.0.0 inside the container for the published port to reach it.
            # Exposure is limited by binding the host side to loopback under `ports`.
            MCP_HTTP_HOST: 0.0.0.0
            MCP_HTTP_PORT: 8765
            PAPERLESS_DOWNLOAD_DIR: /downloads
            # The Host header arriving through the port mapping. Add your own name here
            # if you reach the container as anything other than localhost/127.0.0.1.
            MCP_ALLOWED_HOSTS: localhost,127.0.0.1
            # Uncomment to require `Authorization: Bearer <token>` on every request.
            # Set MCP_AUTH_TOKEN in .env rather than committing it here.
            # MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
            # Uncomment to let the assistant read but never modify the archive.
            # PAPERLESS_READ_ONLY: 1

        ports:
            # Loopback-only on purpose: the archive is personal data, and the
            # endpoint is unauthenticated unless MCP_AUTH_TOKEN is set. Change to
            # "8765:8765" only if you also set MCP_AUTH_TOKEN.
            - '127.0.0.1:8765:8765'

        volumes:
            # Downloaded documents show up here on the host.
            - ./downloads:/downloads

        # Hardening: nothing in the image needs to write outside /downloads and /tmp.
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true

        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:8765/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 3

    # A one-shot stdio server, for MCP clients that spawn a subprocess.
    # It never starts with `docker compose up` because of the profile.
    #
    #   docker compose run --rm -T --profile stdio paperless-mcp-stdio
    #
    # In practice you would point the MCP client straight at `docker run`
    # instead — see the README.
    paperless-mcp-stdio:
        profiles:
            - stdio
        build:
            context: .
        image: paperless-ngx-mcp:0.1.0
        env_file:
            - .env
        environment:
            MCP_TRANSPORT: stdio
            PAPERLESS_DOWNLOAD_DIR: /downloads
        volumes:
            - ./downloads:/downloads
        stdin_open: true
        tty: false
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
# If paperless-ngx itself runs in Docker, join its network and use its service
# name in PAPERLESS_URL (e.g. http://paperless-webserver:8000) instead of a
# host-visible URL:
#
# networks:
#     default:
#         name: paperless_default
#         external: true
